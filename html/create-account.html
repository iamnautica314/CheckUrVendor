<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Create Account | Check Ur Vendor</title>
   <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav>
    <h2>🛡️ Check Ur Vendor</h2>
    <ul>
        <li>
            <a href="index.html">Home</a>
        </li>
        <li>
            <a href="assessment.html">Assessment</a>
        </li>
        <li>
            <a href="dashboard.html">Dashboard</a>
        </li>
        <li>
            <a href="results.html">Results</a>
        </li>
    </ul>
</nav>
<main class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                🛡️
            </div>
            <h1>Create Account</h1>
            <p>
                Create your Check Ur Vendor account
            </p>
        </div>
        <form id="createAccountForm">
            <div class="form-group">
                <label for="fullName">
                    Full Name
                </label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>
            <div class="form-group">
                <label for="accountEmail">
                    Email
                </label>
                <input
                    type="email"
                    id="accountEmail"
                    name="accountEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>
            <div class="form-group">
                <label for="accountPassword">
                    Password
                </label>
                <input
                    type="password"
                    id="accountPassword"
                    name="accountPassword"
                    placeholder="Create a password"
                    required
                >
            </div>
            <div class="form-group">
                <label for="confirmPassword">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>
            <button
                type="submit"
                class="login-button"
            >
                Create Account
            </button>
        </form>
        <div class="create-account">
            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>
        </div>
        <div class="back-home">
            <a href="index.html">
                ← Back to Check Ur Vendor
            </a>
        </div>
    </div>
</main>
<script src="../js/create-account.js"></script>
</body>
</html>
